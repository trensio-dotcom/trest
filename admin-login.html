<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trensio — Admin Login</title>
<link rel="icon" type="image/jpeg" href="fav.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --black:#0b0b0b;
  --gold:#e0a831;
  --white:#fff;
  --grey:#f4f4f4;
  --red:#e53e3e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 7% 30px;
  background:url('background.jpg') center/cover no-repeat;
  position:relative;
}
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.62);
}

.back-button{
  position:fixed;
  top:24px;
  left:24px;
  z-index:10;
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--white);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  padding:10px 18px;
  background:rgba(255,255,255,.12);
  transition:.3s;
}
.back-button:hover{
  background:var(--gold);
  color:var(--black);
}

.admin-card{
  position:relative;
  z-index:2;
  background:var(--white);
  width:100%;
  max-width:420px;
  padding:38px 32px;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
}
.admin-logo{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}
.admin-logo img{
  height:52px;
}
.admin-title{
  text-align:center;
  font-size:1.35rem;
  font-weight:700;
  color:var(--black);
  margin-bottom:6px;
}
.admin-subtitle{
  text-align:center;
  color:#666;
  font-size:.85rem;
  font-weight:300;
  margin-bottom:26px;
}
.input-group{
  margin-bottom:18px;
}
label{
  display:block;
  font-size:.82rem;
  font-weight:600;
  color:#333;
  margin-bottom:7px;
}
.input-box{
  position:relative;
}
.input-box i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#999;
  font-size:.9rem;
  cursor:pointer;
}
input{
  width:100%;
  padding:13px 42px 13px 14px;
  border:1px solid #ddd;
  font-family:inherit;
  font-size:.92rem;
  outline:none;
  transition:.25s;
}
input:focus{
  border-color:var(--black);
}
input.error{
  border-color:var(--red);
}
.error-text{
  color:var(--red);
  font-size:.75rem;
  margin-top:5px;
  display:none;
}
.error-text.show{
  display:block;
}
.btn-main{
  width:100%;
  background:var(--black);
  color:var(--white);
  border:none;
  padding:14px;
  font-family:inherit;
  font-weight:600;
  font-size:.95rem;
  cursor:pointer;
  margin-top:8px;
  transition:.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn-main:hover{
  background:var(--gold);
  color:var(--black);
}
.btn-main:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.message{
  display:none;
  padding:12px 14px;
  font-size:.82rem;
  margin-bottom:18px;
  line-height:1.5;
}
.message.error{
  display:block;
  background:rgba(229,62,62,.08);
  color:var(--red);
  border-left:3px solid var(--red);
}
@media(max-width:480px){
  body{padding:80px 5% 20px}
  .admin-card{padding:30px 22px}
  .back-button{top:16px;left:16px;padding:9px 14px;font-size:.82rem}
}
</style>
</head>
<body>

<a href="index.html" class="back-button">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</a>

<div class="admin-card">

  <div class="admin-logo">
    <img src="trensio.png" alt="Trensio">
  </div>

  <div class="admin-title">Admin Login</div>
  <div class="admin-subtitle">Enter the admin password to access the Trensio control panel.</div>

  <div class="message" id="messageBox"></div>

  <form id="adminLoginForm" novalidate>
    <div class="input-group">
      <label for="adminPassword">Admin Password</label>
      <div class="input-box">
        <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        <i class="fa-regular fa-eye" id="passwordToggle"></i>
      </div>
      <div class="error-text" id="passwordError">Please enter the admin password.</div>
    </div>

    <button type="submit" class="btn-main" id="loginButton">
      <span>Login</span>
      <i class="fa-solid fa-right-to-bracket"></i>
    </button>
  </form>

</div>

<script>
const adminLoginForm = document.getElementById('adminLoginForm');
const adminPasswordInput = document.getElementById('adminPassword');
const passwordError = document.getElementById('passwordError');
const passwordToggle = document.getElementById('passwordToggle');
const messageBox = document.getElementById('messageBox');
const loginButton = document.getElementById('loginButton');

passwordToggle.addEventListener('click', () => {
  if(adminPasswordInput.type === 'password'){
    adminPasswordInput.type = 'text';
    passwordToggle.classList.remove('fa-eye');
    passwordToggle.classList.add('fa-eye-slash');
  } else {
    adminPasswordInput.type = 'password';
    passwordToggle.classList.remove('fa-eye-slash');
    passwordToggle.classList.add('fa-eye');
  }
});

adminLoginForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const password = adminPasswordInput.value.trim();

  if(!password){
    adminPasswordInput.classList.add('error');
    passwordError.classList.add('show');
    return;
  }

  adminPasswordInput.classList.remove('error');
  passwordError.classList.remove('show');

  loginButton.disabled = true;

  // Save admin password temporarily for admin.html to use
  localStorage.setItem('trensioAdminPassword', password);

  // Redirect to admin dashboard
  window.location.href = 'admin.html';
});
</script>

</body>
</html>
